name: Build and Push to DockerHub

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [dev]

jobs:
  # Check all commit messages on pull request to dev branch
  check-commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check all commit messages in PR
        run: |
          echo "Checking commit messages in PR..."
          git fetch origin ${{ github.event.pull_request.head.ref }}
          git log origin/${{ github.event.pull_request.head.ref }} --format=%s | \
            grep -Ev "^(feat|fix|docs|style|refactor|test|chore):" && {
              echo "❌ Invalid commit messages found!"
              exit 1
            } || {
              echo "✅ All commit messages are valid."
            }

  # Build and push Docker images on push to main or dev
  build-and-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, backend1, backend2]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: semikadhakal123
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine tag
        id: vars
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "TAG=latest" >> $GITHUB_OUTPUT
          else
            BRANCH_NAME=$(echo "${GITHUB_REF#refs/heads/}" | tr / -)
            SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
            echo "TAG=${BRANCH_NAME}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push image for ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            semikadhakal123/${{ matrix.service }}:${{ steps.vars.outputs.TAG }}
            semikadhakal123/${{ matrix.service }}:${{ github.sha }}

