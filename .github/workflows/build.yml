name: Dev Build and Push

on:
  push:
    branches: [dev]
    paths:
      - 'frontend/**'
      - 'backend1/**'
      - 'backend2/**'
  pull_request:
    branches: [dev]
    paths:
      - 'frontend/**'
      - 'backend1/**'
      - 'backend2/**'

env:
  REGISTRY: docker.io
  FRONTEND_IMAGE_NAME: semikadhakal123/frontend
  BACKEND1_IMAGE_NAME: semikadhakal123/backend1
  BACKEND2_IMAGE_NAME: semikadhakal123/backend2

jobs:
  changes:
    runs-on: [self-hosted, runner]
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend1: ${{ steps.filter.outputs.backend1 }}
      backend2: ${{ steps.filter.outputs.backend2 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend1:
              - 'backend1/**'
            backend2:
              - 'backend2/**'

  commitlint:
    needs: changes
    if: github.event_name == 'pull_request' &&
        startsWith(github.head_ref, 'feature') &&
        github.base_ref == 'dev'
    runs-on: [self-hosted, runner]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Commitlint
        run: npm install --save-dev @commitlint/cli @commitlint/config-conventional

      - name: Add commitlint config
        run: echo "module.exports = {extends: ['@commitlint/config-conventional']};" > commitlint.config.js

      - name: Run Commitlint
        run: git log origin/${{ github.base_ref }}..HEAD --pretty=format:"%s" | npx commitlint

  check_lint:
    needs: [commitlint, changes]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend1 == 'true' || needs.changes.outputs.backend2 == 'true'
    runs-on: [self-hosted, runner]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install packages and run lint - backend1
        if: needs.changes.outputs.backend1 == 'true'
        working-directory: backend1
        run: |
          yarn
          yarn lint

      - name: Install packages and run lint - backend2
        if: needs.changes.outputs.backend2 == 'true'
        working-directory: backend2
        run: |
          yarn
          yarn lint

      - name: Install packages and run lint - frontend
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: |
          yarn
          yarn lint

  build_docker:
    needs: [changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' &&
        (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend1 == 'true' || needs.changes.outputs.backend2 == 'true')
    runs-on: [self-hosted, semika]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend1 Image
        if: needs.changes.outputs.backend1 == 'true'
        uses: docker/build-push-action@v5
        with:
          context: backend1
          file: backend1/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND1_IMAGE_NAME }}:dev-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.BACKEND1_IMAGE_NAME }}:dev-latest

      - name: Build and Push Backend2 Image
        if: needs.changes.outputs.backend2 == 'true'
        uses: docker/build-push-action@v5
        with:
          context: backend2
          file: backend2/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND2_IMAGE_NAME }}:dev-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.BACKEND2_IMAGE_NAME }}:dev-latest

      - name: Build and Push Frontend Image
        if: needs.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:dev-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:dev-latest

