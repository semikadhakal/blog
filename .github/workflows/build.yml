name: Build and Push to DockerHub

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [dev]

jobs:
  # Check commits on pull requests
  check-commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check commit message
        run: |
          echo "Checking if commit message starts with feat:, fix:, docs:, etc."
          git log --format=%s -n 1 | grep -E "^(feat|fix|docs|style|refactor|test|chore):"

  # Build and push images
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, backend1, backend2]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.semikadhakal123 }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.semikadhakal123 }}/${{ matrix.service }}:${{ github.ref == 'refs/heads/main' && 'latest' || 'dev' }}
            ${{ secrets.semikadhakal123 }}/${{ matrix.service }}:${{ github.sha }}

