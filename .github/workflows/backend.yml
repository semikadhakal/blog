name: Backend CI/CD

on:
  push:
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  build-backend:
    runs-on: [self-hosted, backend-runner]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: backend-${{ github.sha }}
          restore-keys: |
            backend-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: your-dockerhub-username/backend:latest

      - name: Save Docker image as .tar
        run: |
          docker save your-dockerhub-username/backend:latest -o backend.tar

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-docker-image
          path: backend.tar

      - name: Deploy to VM (use ssh)
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@YOUR_BACKEND_VM_IP "
          docker pull your-dockerhub-username/backend:latest &&
          docker stop backend || true &&
          docker rm backend || true &&
          docker run -d --name backend -p 3000:3000 your-dockerhub-username/backend:latest
          "
        env:
          PRIVATE_KEY: ${{ secrets.VM_SSH_KEY }}

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          files: backend.tar

