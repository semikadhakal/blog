name: Backend CI/CD

on:
  push:
    branches: [dev, main]
    paths:
      - 'backend1/**'
      - 'backend2/**'
      - 'frontend/**'
  pull_request:
    branches: [dev, main]
    paths:
      - 'backend1/**'
      - 'backend2/**'
      - 'frontend/**'

env:
  REGISTRY: docker.io
  FRONTEND_IMAGE_NAME: semikadhakal123/frontend
  BACKEND1_IMAGE_NAME: semikadhakal123/backend1
  BACKEND2_IMAGE_NAME: semikadhakal123/backend2

jobs:
  build-app:
    runs-on: [self-hosted, runner]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Restore Yarn cache
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            ~/.cache/yarn
          key: yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: yarn-

      - name: Install dependencies (frontend)
        working-directory: frontend
        run: yarn

      - name: Install dependencies (backend1)
        working-directory: backend1
        run: yarn

      - name: Install dependencies (backend2)
        working-directory: backend2
        run: yarn

      - name: Build Frontend
        working-directory: frontend
        run: yarn build

      - name: Build Backend1
        working-directory: backend1
        run: yarn build

      - name: Build Backend2
        working-directory: backend2
        run: yarn build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: full-app-build
          path: |
            frontend/dist
            backend1/dist
            backend2/dist

  docker-and-deploy:
    needs: build-app
    runs-on: [self-hosted, semika]
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend1 Image
        uses: docker/build-push-action@v5
        with:
          context: backend1
          file: backend1/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND1_IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.BACKEND1_IMAGE_NAME }}:${{ github.sha }}

      - name: Build & Push Backend2 Image
        uses: docker/build-push-action@v5
        with:
          context: backend2
          file: backend2/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND2_IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.BACKEND2_IMAGE_NAME }}:${{ github.sha }}

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to VM
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
        run: |
          echo "$SSH_PRIVATE_KEY" > key.pem
          chmod 600 key.pem
          ssh -o StrictHostKeyChecking=no -i key.pem $REMOTE_USER@$REMOTE_HOST << 'EOF'
            docker pull semikadhakal123/backend1:dev-latest
            docker pull semikadhakal123/backend2:dev-latest
            docker pull semikadhakal123/frontend:dev-latest
            docker-compose -f ~/deployment/docker-compose.yml up -d
          EOF

  release:
    if: github.ref == 'refs/heads/main'
    needs: docker-and-deploy
    runs-on: [self-hosted, runner]
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Get latest tag
        id: get_tag
        run: echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: Release ${{ steps.get_tag.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

